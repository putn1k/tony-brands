<div class="hystmodal modal"
     id="send-ok-modal"
     aria-hidden="true">
  <div class="hystmodal__wrap">
    <div class="hystmodal__window"
         role="dialog"
         data-lenis-prevent
         aria-modal="true">
      <div class="modal__content">
        <button class="modal__close"
                type="button"
                aria-label="Закрыть окно"
                data-hystclose>
          <svg class="modal__close-icon"
               width="32"
               height="32"
               aria-hidden="true">
            <use xlink:href="assets/img/sprite.svg#cross"></use>
          </svg>
        </button>
        <p class="t3 modal__title">Спасибо за заявку!</p>
        <p class="t5">Мы свяжемся с вами в ближайшее время и обсудим все детали.</p>
        <button class="btn btn--prim"
                data-hystclose>Хорошо</button>
      </div>
    </div>
  </div>
</div>
